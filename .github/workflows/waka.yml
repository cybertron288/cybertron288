name: WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README with WakaTime stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # writes between <!--START_SECTION:waka--> and <!--END_SECTION:waka-->
          SHOW_TOTAL: "true"
          SHOW_TIME: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: "all_time"
